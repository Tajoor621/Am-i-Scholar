name: Generate approved brand icons
on:
  push:
    paths:
      - 'brand/icon-master.webp'
      - 'brand/generate_assets.py'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Pillow build dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate all sizes
        run: python brand/generate_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/*.png docs/brand/*.png app/src/main/res/mipmap-*/ic_launcher*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate all web and Android launcher PNG sizes from approved logo"
            git push
          fi
